# Binary Release Workflow
#
# Builds and publishes rs-cli-tmpl binaries for multiple platforms on tag push.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  lint:
    uses: ./.github/workflows/run-linters.yml

  test:
    uses: ./.github/workflows/run-tests.yml

  coverage:
    uses: ./.github/workflows/collect-coverage.yml

  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: [lint, test, coverage, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Install cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0

      - name: Sign release binaries
        shell: bash
        run: |
          set -euo pipefail
          for artifact in \
            rs-cli-tmpl-linux-x86_64 \
            rs-cli-tmpl-linux-aarch64 \
            rs-cli-tmpl-darwin-x86_64 \
            rs-cli-tmpl-darwin-aarch64; do
            if [ ! -f "${artifact}" ]; then
              echo "::error::Release artifact '${artifact}' not found."
              exit 1
            fi

            echo "Signing ${artifact}..."
            cosign sign-blob --yes --bundle "${artifact}.bundle" "${artifact}" > "${artifact}.sig"
          done

      - name: Attest release binaries
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            rs-cli-tmpl-linux-x86_64
            rs-cli-tmpl-linux-aarch64
            rs-cli-tmpl-darwin-x86_64
            rs-cli-tmpl-darwin-aarch64

      - name: Create release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b
        with:
          files: |
            rs-cli-tmpl-linux-x86_64
            rs-cli-tmpl-linux-aarch64
            rs-cli-tmpl-darwin-x86_64
            rs-cli-tmpl-darwin-aarch64
            rs-cli-tmpl-linux-x86_64.sig
            rs-cli-tmpl-linux-aarch64.sig
            rs-cli-tmpl-darwin-x86_64.sig
            rs-cli-tmpl-darwin-aarch64.sig
            rs-cli-tmpl-linux-x86_64.bundle
            rs-cli-tmpl-linux-aarch64.bundle
            rs-cli-tmpl-darwin-x86_64.bundle
            rs-cli-tmpl-darwin-aarch64.bundle
          generate_release_notes: true
