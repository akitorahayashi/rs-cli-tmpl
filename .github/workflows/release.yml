# Binary Release Workflow
#
# Builds and publishes rs-cli-tmpl binaries for multiple platforms on tag push.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  lint:
    permissions:
      contents: read
    uses: ./.github/workflows/run-linters.yml

  test:
    permissions:
      contents: read
    uses: ./.github/workflows/run-tests.yml

  coverage:
    permissions:
      contents: read
    uses: ./.github/workflows/collect-coverage.yml

  build:
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml

  release:
    needs: [lint, test, coverage, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b
        with:
          files: |
            rs-cli-tmpl-linux-x86_64
            rs-cli-tmpl-linux-aarch64
            rs-cli-tmpl-darwin-x86_64
            rs-cli-tmpl-darwin-aarch64
          generate_release_notes: true
          overwrite_files: true
